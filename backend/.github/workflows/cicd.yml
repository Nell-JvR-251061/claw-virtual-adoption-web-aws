name: Claw Virtual Adoption AWS

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}     
      - name: Build Docker Image
        run: docker build -t nelljvr/claw-virtual-adoption-web-aws  .
      - name: Publish Image to docker hub
        run: docker push nelljvr/claw-virtual-adoption-web-aws:latest 
 
  deploy:
    needs: build
    runs-on: self-hosted 
    steps:
      - name: Pull image from docker hub
        run: docker pull nelljvr/claw-virtual-adoption-web-aws:latest 
      - name: Delete old container
        run: docker rm -f claw-virtual-adoption-web-aws-container  
      - name: Run Docker Container
        run: docker run -d -p 4000:4000 --name claw-virtual-adoption-web-aws-container -e MONGO_URI='${{ secrets.MONGO_URI }}' nelljvr/claw-virtual-adoption-web-aws